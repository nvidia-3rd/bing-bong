[tool.poetry]
name = "bing_bong"
version = "0.1.0"
description = ""
authors = ["jinsu <moonlt93@github.com>"]
readme = "README.md"
packages = [{include = "bing_bong"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.116.1"
uvicorn = "^0.35.0"
numpy = "^2.1.3" 
opencv-python = "^4.8.0"
pillow = "^10.0.0"
matplotlib = "^3.7.0"
requests = "^2.31.0"


aiortc = "^1.6.0"
av = "^12.0.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"

jinja2 = "^3.1.0"
deepface = "0.0.95"
tensorflow = "2.19.1"  # DeepFace와 호환되는 안정적인 버전
tf-keras = "^2.19.0"  # TensorFlow 2.19.1에서 필요한 패키지
pandas = ">=1.5.0,<3.0.0"  # TensorFlow 호환 범위
protobuf = ">=3.20.3,<4.24.0"  # TensorFlow 호환성을 위한 범위
soundfile = "^0.12.1"  # WAV 파일 저장용
scipy = "^1.11.0"  # 오디오 신호 처리용
python-multipart = "^0.0.20"

[tool.poetry.scripts]
start = "bing_bong.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
